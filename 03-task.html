<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>first</title>
</head>

<body>
    <script>
        function Book(title, author, year, pages){
            this.title = title;
            this.author = author;
            this.year = year;
            this.pages = pages;
            this.isTaken = false;
        }

        Book.prototype.showBookInfo = function (element) {
            console.log("Title: " + this.title + "\n");
            console.log("Author: " + this.author + "\n");
            console.log("Year: " + this.year + "\n");
            console.log("Pages: " + this.pages + "\n");
            console.log("Taken: " + this.isTaken + "\n");
        };
        Book.prototype.takeBook = function (element) {
            if (!this.isTaken)
            {
                this.isTaken=true;
                console.log("Took out "+this.title);
            }
            else
                console.log(this.title+" has already been taken");
        };
        Book.prototype.returnBook = function (element) {
            if (this.isTaken)
            {
                this.isTaken=false;
                console.log("Returned "+this.title);
            }
            else
                console.log(this.title+" is already in the library\n");
        };
        Book.prototype.changeTitle = function (newTitle) {
            this.title=newTitle;
            console.log("changed the book's title to "+newTitle);
        };
        Book.prototype.changeAuthor = function (newAuthor) {
            this.author=newAuthor;
            console.log("changed the book's author to "+newAuthor);
        };
        Book.prototype.getAge = function (element) {
            return 2026-this.year;
        };
        
        let book = new Book("Nineteen Eighty-Four", "George Orwell", 1949, 328);

        book.showBookInfo();
        book.changeTitle("1984");
        book.changeAuthor("jorjor wel");
        console.log("age: "+book.getAge());
        book.takeBook();
        book.takeBook();
        book.returnBook();
    </script>
</body>

</html>
